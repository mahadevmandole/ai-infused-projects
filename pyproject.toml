[project]
name = "ai-infused-projects"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pre-commit>=4.6.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
