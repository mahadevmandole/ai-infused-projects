[project]
name = "ai-infused-projects"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "google-genai>=1.0.0",
    "groq>=0.11.0",
    "httpx2>=0.28.0",
    "openai>=1.0.0",
    "pre-commit>=4.6.1",
    "pydantic>=2.11.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = [".", "apps/starter_ai_app/backend"]
